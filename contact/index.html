<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — Anders Holtan</title>
<meta name="description" content="Get in touch with Anders Holtan.">
<meta name="theme-color" content="#15181e">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta property="og:type" content="website">
<meta property="og:title" content="Contact — Anders Holtan">
<meta property="og:description" content="Get in touch with Anders Holtan.">
<meta property="og:image" content="../assets/img/icon-512.png">

<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../assets/img/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/img/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&amp;family=Inter:wght@400..700&amp;display=swap">

<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/pages.css">
<link rel="stylesheet" href="../assets/css/timeline.css">

<!-- Sets the theme before the first paint, so there is never a flash of the
     wrong colours. Kept inline and tiny on purpose. -->
<script>
(function () {
  var d = document.documentElement;
  try {
    var s = localStorage.getItem('ah.theme');
    var t = (s === 'light' || s === 'dark') ? s : 'dark';   // dark is the house default
    d.setAttribute('data-theme', t);
    d.style.colorScheme = t;
    var l = localStorage.getItem('ah.lang');
    if (!l) l = /\b(no|nb|nn)\b/.test((navigator.languages || [navigator.language || '']).join(',').toLowerCase()) ? 'no' : 'en';
    d.setAttribute('lang', l === 'no' ? 'no' : 'en');
  } catch (e) { d.setAttribute('data-theme', 'dark'); }
  d.classList.remove('no-js');

  /* Failsafe. The content of this site is rendered by JavaScript, and the
     rise-and-fade effect starts every block invisible. If app.js never runs
     at all — a bad deploy, a blocked CDN, an old browser choking on a module
     — nothing would remove that invisibility and the page would look empty.
     So: app.js sets window.__appReady as its very first act. If it has not
     done so within three seconds, we mark the document and CSS forces all
     content visible. A missing animation is a nuisance; a blank page is not. */
  setTimeout(function () {
    if (!window.__appReady) d.classList.add('js-failed');
  }, 3000);
})();
</script>
</head>

<body>
<a class="skiplink" href="#main" data-i18n="nav.skip">Skip to content</a>

<!-- The constellation field. Decorative, never interactive. -->
<canvas id="sky" class="sky" aria-hidden="true"></canvas>

<div class="shell">

  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="../" aria-label="Anders Holtan — home">
        <span class="brand__mark" aria-hidden="true"></span>
      </a>

      <!-- app.js rebuilds this from NAV in config.js. The links below are the
           no-JavaScript fallback and are replaced on load. -->
      <nav class="nav" data-nav aria-label="Main">
        <a class="nav__link" href="../">Home</a>
        <a class="nav__link" href="../#cv">CV</a>
        <a class="nav__link" href="../projects/">Projects</a>
        <a class="nav__link is-active" href="../contact/">Contact</a>
      </nav>

      <div class="topbar__tools">
        <button class="iconbtn langbtn" type="button" data-lang-toggle data-i18n-aria="nav.lang" aria-label="Switch language">
          <span data-lang-current>EN</span>
        </button>
        <button class="iconbtn" type="button" data-theme-toggle data-i18n-aria="nav.theme" aria-label="Toggle light / dark theme" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.1 6.1 4.6 4.6M19.4 19.4l-1.5-1.5M17.9 6.1l1.5-1.5M4.6 19.4l1.5-1.5"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.6 8.6 0 1 0 10.9 10.9z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" data-page="contact">
    <section class="section wrap contact" aria-labelledby="contact-title">
      <div class="section__head reveal">
        <h1 class="section__title" id="contact-title" data-i18n="contact.title">Contact</h1>
        <p class="section__lead" data-i18n="contact.lead">Send me a message and it lands straight in my inbox.</p>
      </div>

      <!-- The form posts to a relay service (see config.js). The destination
           address is stored on their side and is not present anywhere in this
           page's source. -->
      <form class="contact__form reveal" data-contact-form novalidate>
        <div class="contact__row">
          <div class="field">
            <label class="field__label" for="name" data-i18n="contact.name">Name</label>
            <input class="input" id="name" name="name" type="text" autocomplete="name" required>
            <p class="field__error" id="err-name" data-error-for="name" role="alert" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="email" data-i18n="contact.email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
            <p class="field__error" id="err-email" data-error-for="email" role="alert" hidden></p>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="message" data-i18n="contact.message">Message</label>
          <textarea class="textarea" id="message" name="message" rows="7" required></textarea>
          <p class="field__error" id="err-message" data-error-for="message" role="alert" hidden></p>
        </div>

        <!-- Bot trap. Hidden from people, irresistible to scripts. -->
        <div class="honeypot" aria-hidden="true">
          <label>Leave this empty<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
        </div>

        <div class="contact__actions">
          <button class="btn" type="submit" data-i18n="contact.send">Send message</button>
        </div>

        <p class="formstatus" data-status role="status" aria-live="polite" aria-atomic="true" hidden></p>
      </form>

      <div class="contact__elsewhere reveal" data-contact-links></div>
    </section>

    <noscript>
      <section class="section wrap">
        <div class="errcard">
          <p>The message form needs JavaScript. You can reach me on
             <a href="https://www.linkedin.com/in/anders-holtan-715635182/">LinkedIn</a>.</p>
        </div>
      </section>
    </noscript>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span>&copy; <span class="tnum">2026</span> Anders Holtan</span>
      <span><a href="../#cv" data-i18n="cv.title">CV</a></span>
    </div>
  </footer>

</div>

<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
